name: selecter_camera
description: "スキー撮影に特化したカメラアプリ"
publish_to: 'none'
version: 1.0.0+1

android:
  minSdkVersion: 24
  targetSdkVersion: 34

environment:
  sdk: '>=3.8.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # 状態管理
  flutter_riverpod: ^3.2.1

  # カメラ・動画
  camera: ^0.11.2+1
  video_player: ^2.8.2
  video_thumbnail: ^0.5.6
  ffmpeg_kit_flutter_new: ^4.1.0

  # ストレージ・ファイル
  path_provider: ^2.1.5
  gal: 2.1.4
  shared_preferences: ^2.3.0

  # デバイス・センサー
  native_device_orientation: ^2.1.0
  permission_handler: ^12.0.1
  sensors_plus: ^7.0.0

  # 画像・共有
  image_picker: ^1.0.0
  image_cropper: ^11.0.0
  share_plus: ^12.0.1

  # ユーティリティ
  uuid: ^4.5.2
  equatable: ^2.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.5.0
  build_runner: ^2.7.1

flutter:
  uses-material-design: true
